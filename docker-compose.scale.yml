# Several GanttLines copies behind a load balancer (Caddy), sharing one database:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
# Copies: GL_REPLICAS (default 2). Same .env as usual.
services:
  app:
    environment:
      CLUSTER: postgres
      # Visitors' addresses come from Caddy (rate limits are per visitor, not per proxy)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    deploy:
      replicas: ${GL_REPLICAS:-2}
    ports: !reset []

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on: [app]

configs:
  caddyfile:
    content: |
      :3000 {
        reverse_proxy {
          # Copies are looked up often, so stopped ones leave the rotation quickly …
          dynamic a {
            name app
            port 3000
            refresh 2s
          }
          lb_policy round_robin
          # … and meanwhile a request that can't reach one is retried on another.
          lb_try_duration 10s
          lb_try_interval 100ms
          fail_duration 10s
        }
      }
