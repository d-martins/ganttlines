# GanttLines — app + PostgreSQL. Copy .env.example to .env, fill it in, then: docker compose up -d
name: ganttlines

services:
  app:
    image: ${GP_IMAGE:-ghcr.io/d-martins/ganttlines}:${GP_TAG:-latest}
    restart: unless-stopped
    environment:
      # The bundled database, unless DATABASE_URL points at your own
      DATABASE_URL: ${DATABASE_URL:-postgresql://gantt:${POSTGRES_PASSWORD}@postgres:5432/ganttlines}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BACKUP_BEFORE_MIGRATE: ${BACKUP_BEFORE_MIGRATE:-true}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a database on this machine (Linux; built in elsewhere)
    depends_on:
      postgres:
        condition: service_healthy
        required: false # absent when using your own database

  postgres:
    image: postgres:17
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ganttlines
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantt -d ganttlines"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  backups:
