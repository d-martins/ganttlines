name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @ganttlines/db generate
      - run: yarn type-check
      # The server's tests start a throwaway PostgreSQL in Docker (available on GitHub's runners).
      - run: yarn test
      # The server's tests again, with copies coordinating through Postgres (CLUSTER=postgres).
      - run: yarn workspace @ganttlines/server test:cluster
      - run: yarn workspace @ganttlines/e2e playwright install --with-deps chromium
      - run: yarn e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7
