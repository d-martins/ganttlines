name: Release

# Push a version tag to publish: git tag v1.2.0 && git push origin v1.2.0
# For release notes, annotate the tag with them (verbatim, so Markdown headings survive):
#   git tag -a v1.2.0 --cleanup=verbatim -F notes.md && git push origin v1.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.4.0, 1.4, 1 and latest (pre-releases like 1.4.0-rc.1 only get their own tag; no "0" tag before 1.0)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release (notes from the tag's message, else the commits since the last one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout leaves the tag lightweight; fetch it again to read an annotated tag's message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # An annotated tag's message is the notes, unless it's only the tag's name.
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = tag ]; then git tag -l --format='%(contents)' "$TAG" | sed "1{/^$TAG\$/d;}" > notes.md; fi
          flags="--verify-tag"
          if grep -q '[^[:space:]]' notes.md; then flags="$flags --notes-file notes.md"; else flags="$flags --generate-notes"; fi
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags --title "GanttLines ${TAG#v}"
